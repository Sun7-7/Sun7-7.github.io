<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Neuromorphic research architecture</title>
  <desc id="desc">A light research architecture map linking neuromorphic core mechanisms, signal-processing applications, and device-aware modeling.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfcf7"/>
      <stop offset="0.58" stop-color="#f3f8f1"/>
      <stop offset="1" stop-color="#f7f0df"/>
    </linearGradient>
    <linearGradient id="greenWash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f5ef"/>
      <stop offset="1" stop-color="#fff9ec"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#2f8f78"/>
      <stop offset="1" stop-color="#b88932"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#23342d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="712" height="452" rx="28" fill="url(#paper)" stroke="#d8e2d7" stroke-width="2"/>

