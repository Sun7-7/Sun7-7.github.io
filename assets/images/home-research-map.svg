    <text x="566" y="304" text-anchor="middle" fill="#9b6e24" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Validation</text>
    <path d="M522 354h88" stroke="#d6ded4" stroke-width="3" stroke-linecap="round"/>
    <path d="M522 354l18-23 18 15 24-38 26 45" fill="none" stroke="#b88932" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="582" cy="316" r="5" fill="#2f8f78"/>
