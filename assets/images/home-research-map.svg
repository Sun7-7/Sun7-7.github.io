    <text x="154" y="304" text-anchor="middle" fill="#227763" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Temporal Coding</text>
    <path d="M102 354H206" stroke="#d6ded4" stroke-width="2"/>
    <path d="M112 354v-30M138 354v-18M164 354v-48M190 354v-28" stroke="#2f8f78" stroke-width="6" stroke-linecap="round"/>
    <circle cx="164" cy="306" r="4" fill="#d7a24a"/>
